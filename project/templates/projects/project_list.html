{% extends 'projects/base.html' %}

{% block title %}Inicio | Mis Proyectos{% endblock %}

{% block content %}
<h1 class="mb-4">Mis Proyectos</h1>
<div class="row">
    {% for project in projects %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <img src="{{ project.image_url }}" class="card-img-top" alt="{{ project.title }}">
            <div class="card-body">
                <h5 class="card-title">{{ project.title }}</h5>
                <p class="card-text">{{ project.description|truncatewords:15 }}</p>
                <a href="{% url 'project_detail' project.pk %}" class="btn btn-primary btn-sm">Leer más</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
